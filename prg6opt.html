<html>
<body>
<script>

// STRING FUNCTIONS

function stringFunctions() {
    var str = document.getElementById("str").value;

    if (str === "") {
        alert("Please enter a string");
        return;
    }

    var result = "";

    result += "Original String : " + str + "<br><br>";
    result += "Length : " + str.length + "<br><br>";
    result += "Uppercase : " + str.toUpperCase() + "<br><br>";
    result += "Lowercase : " + str.toLowerCase() + "<br><br>";
    result += "Character at 2 : " + str.charAt(2) + "<br><br>";
    result += "Substring : " + str.substring(0,10) + "<br><br>";
    result += "Replace : " + str.replace("JavaScript","HTML") + "<br><br>";

    document.getElementById("stringResult").innerHTML = result;
}


// MATH FUNCTIONS

function mathFunctions() {
    var n1 = document.getElementById("num1").value;
    var n2 = document.getElementById("num2").value;

    if (n1 === "" || n2 === "") {
        alert("Please enter both numbers");
        return;
    }

    n1 = Number(n1);
    n2 = Number(n2);

    var result = "";

    result += "First Number : " + n1 + "<br><br>";
    result += "Second Number : " + n2 + "<br><br>";
    result += "Square Root : " + Math.sqrt(n1) + "<br><br>";
    result += "Power : " + Math.pow(n1,n2) + "<br><br>";
    result += "Round : " + Math.round(n1) + "<br><br>";
    result += "Ceil : " + Math.ceil(n1) + "<br><br>";
    result += "Floor : " + Math.floor(n1) + "<br><br>";
    result += "Maximum : " + Math.max(n1,n2) + "<br><br>";
    result += "Minimum : " + Math.min(n1,n2) + "<br><br>";

    document.getElementById("mathResult").innerHTML = result;
}

</script>

</body>
</html>
