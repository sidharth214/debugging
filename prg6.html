<html>
<head>
<title>String</title>
</head>
<body>
<center>
<font size=32 color="green">STRING AND MATH FUNCTIONS</font>
</center>
<script>
var str="JavaScript Programming";

document.write("<h3><u>String Functions</u></h3><br>");

document.write("Original String : "+str+"<br><br>");
document.write("Length : "+str.length+"<br><br>");
document.write("Uppercase : "+str.toUpperCase()+"<br><br>");
document.write("Lowercase : "+str.toLowerCase()+"<br><br>");
document.write("Character at 2 : "+str.charAt(2)+"<br><br>");
document.write("Substring : "+str.substring(0,10)+"<br><br>");
document.write("Replace : "+str.replace("JavaScript","HTML")+"<br><br>");

document.write("<h3><u>Math Functions</u></h3><br>");

document.write("Square Root of 25 : "+Math.sqrt(25)+"<br><br>");
document.write("Power(2,3) : "+Math.pow(2,3)+"<br><br>");
document.write("Round 4.6 : "+Math.round(4.6)+"<br><br>");
document.write("Ceil 4.2 : "+Math.ceil(4.2)+"<br><br>");
document.write("Floor 4.8 : "+Math.floor(4.8)+"<br><br>");
document.write("Maximum : "+Math.max(10,20,30)+"<br><br>");
document.write("Minimum : "+Math.min(10,20,30)+"<br><br>");
</script>
</body>
</html>
